<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora - Efeito Doppler</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h2>Calculadora de Efeito Doppler</h2>
        <form id="dopplerForm">
            <div class="input-group">
                <label for="frequenciaFonte">Frequência da Fonte ($f_0$) [Hz]:</label>
                <input type="number" id="frequenciaFonte" step="any" required placeholder="Ex: 440">
            </div>

            <div class="input-group">
                <label for="velocidadeSom">Velocidade do Som ($v$) [m/s]:</label>
                <input type="number" id="velocidadeSom" step="any" value="340" required placeholder="Ex: 340">
            </div>

            <div class="input-group">
                <label for="velocidadeObservador">Velocidade do Observador ($v_o$) [m/s]:</label>
                <input type="number" id="velocidadeObservador" step="any" required placeholder="Ex: 0 (parado)">
            </div>

            <div class="input-group">
                <label for="direcaoObservador">Direção do Observador:</label>
                <select id="direcaoObservador">
                    <option value="aproximando">Aproximando-se da fonte (+)</option>
                    <option value="afastando">Afastando-se da fonte (-)</option>
                </select>
            </div>

            <div class="input-group">
                <label for="velocidadeFonte">Velocidade da Fonte ($v_f$) [m/s]:</label>
                <input type="number" id="velocidadeFonte" step="any" required placeholder="Ex: 20">
            </div>

            <div class="input-group">
                <label for="direcaoFonte">Direção da Fonte:</label>
                <select id="direcaoFonte">
                    <option value="aproximando">Aproximando-se do observador (-)</option>
                    <option value="afastando">Afastando-se do observador (+)</option>
                </select>
            </div>

            <button type="button" onclick="calcularDoppler()">Calcular Frequência Percebida</button>
        </form>

        <div id="resultado" class="resultado"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
